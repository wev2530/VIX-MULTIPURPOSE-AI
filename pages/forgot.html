<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset password – VIX AI</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/vix-logo.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body data-page="forgot">
<main class="auth"><div class="auth-card">
<div class="auth-brand"><img src="/assets/vix-logo.png" alt="" width="44" height="44">VIX AI</div>
<h1>Reset your password</h1>
<p class="sub">Enter your email and we will send you a reset link.</p>
<div id="notice" class="notice" hidden role="status"></div>
<form id="form" novalidate>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
<button class="btn primary" type="submit" id="submit">Send reset link</button>
</form>
<div class="links"><a href="/pages/login.html">Back to log in</a></div>
</div></main>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
