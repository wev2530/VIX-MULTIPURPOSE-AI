<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New password – VIX AI</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/vix-logo.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body data-page="reset">
<main class="auth"><div class="auth-card">
<div class="auth-brand"><img src="/assets/vix-logo.png" alt="" width="44" height="44">VIX AI</div>
<h1>Choose a new password</h1>
<p class="sub">Use at least 8 characters.</p>
<div id="notice" class="notice" hidden role="status"></div>
<form id="form" novalidate hidden>
<div class="field"><label for="password">New password</label><div class="pw"><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"><button type="button" data-toggle-pw="password" aria-label="Show password">Show</button></div></div>
<div class="field"><label for="confirm">Confirm new password</label><div class="pw"><input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8"><button type="button" data-toggle-pw="confirm" aria-label="Show password">Show</button></div></div>
<button class="btn primary" type="submit" id="submit">Save password</button>
</form>
<div class="links"><a href="/pages/login.html">Back to log in</a></div>
</div></main>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
