<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up – VIX AI</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/vix-logo.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body data-page="signup">
<main class="auth"><div class="auth-card">
<div class="auth-brand"><img src="/assets/vix-logo.png" alt="" width="44" height="44">VIX AI</div>
<h1>Create your account</h1>
<p class="sub">Start using VIX AI in a minute.</p>
<div id="notice" class="notice" hidden role="status"></div>
<form id="form" novalidate>
<div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required maxlength="60"></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">Password (8+ characters)</label><div class="pw"><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"><button type="button" data-toggle-pw="password" aria-label="Show password">Show</button></div></div>
<div class="field"><label for="confirm">Confirm password</label><div class="pw"><input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8"><button type="button" data-toggle-pw="confirm" aria-label="Show password">Show</button></div></div>
<button class="btn primary" type="submit" id="submit">Create account</button>
</form>
<div class="divider">or</div>
<button class="btn google" type="button" id="googleBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M12 12h8"/></svg>Continue with Google</button>
<div class="links"><span>Already have an account? <a href="/pages/login.html">Log in</a></span></div>
</div></main>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
